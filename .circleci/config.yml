version: 2.1

parameters:
  # Off by default: fork PRs must not need registry credentials.
  registry_transfer:
    type: boolean
    default: false
  coverage:
    type: boolean
    default: false

executors:
  linux:
    docker:
      - image: cimg/python:3.12.8@sha256:24def8371540b4130174d39f1f76600377a0163b58add91249a045789488e80f
    working_directory: /tmp/src/afni
    resource_class: medium
    environment:
      AFNI_CI_PIPELINE_ID: << pipeline.id >>

commands:
  setup_host:
    steps:
      - checkout
      - run:
          name: Install container control tools
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pigz
            python -m pip install docker==7.1.0 pytest==8.3.5
      - setup_remote_docker

  setup_base:
    steps:
      - run:
          name: Fingerprint all base-image inputs
          command: |
            cat .docker/afni_dev_base.dockerfile .docker/requirements-ci.txt \
                .docker/start.sh .docker/fix-permissions | sha256sum > /tmp/base-image-key
      - restore_cache:
          keys:
            - base-v3-{{ checksum "/tmp/base-image-key" }}
      - run:
          name: Restore or build dependency image
          no_output_timeout: 30m
          command: |
            if test -f /tmp/base-image/image.tar.gz; then
              pigz -dc /tmp/base-image/image.tar.gz | docker load
            else
              docker build -t afni/afni_dev_base -f .docker/afni_dev_base.dockerfile .
              mkdir -p /tmp/base-image
              docker save afni/afni_dev_base | pigz -2 > /tmp/base-image/image.tar.gz
            fi
      - save_cache:
          key: base-v3-{{ checksum "/tmp/base-image-key" }}
          paths: [/tmp/base-image]

  restore_image:
    parameters:
      build_type:
        type: string
    steps:
      - when:
          condition: << pipeline.parameters.registry_transfer >>
          steps:
            - run:
                name: Pull pipeline-specific image
                command: bash .circleci/image-transfer.sh pull << parameters.build_type >>
      - unless:
          condition: << pipeline.parameters.registry_transfer >>
          steps:
            - restore_cache:
                keys:
                  - image-v3-<< pipeline.id >>-<< parameters.build_type >>
            - run:
                name: Load pipeline-specific image
                command: pigz -dc /tmp/images/<< parameters.build_type >>.tar.gz | docker load

  test_reports:
    steps:
      - store_test_results:
          path: tests/test-results
      - store_artifacts:
          path: tests/output_of_tests
          destination: test-output
      - store_artifacts:
          path: tests/test-results
          destination: test-results

jobs:
  lint:
    executor: linux
    steps:
      - checkout
      - run:
          name: Install pinned lint tools
          command: |
            python -m pip install codespell==2.4.1 PyYAML==6.0.2 black==24.10.0
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cppcheck
      - run:
          name: Resolve comparison revision
          command: bash .circleci/changed-files.sh
      - run:
          name: Fast checks and CI helper tests
          command: |
            python .circleci/lint.py /tmp/afni-changes.json
            python -m unittest discover -s .circleci/tests -v
      - store_artifacts:
          path: /tmp/afni-lint
      - persist_to_workspace:
          root: /tmp
          paths: [afni-changes.json]

  build:
    executor: linux
    parameters:
      build_type:
        type: enum
        enum: [cmake_build, make_build]
    environment:
      BUILD_JOBS: "2"
    steps:
      - setup_host
      - attach_workspace:
          at: /tmp
      - setup_base
      - restore_cache:
          keys:
            - ccache-v3-<< parameters.build_type >>-{{ checksum "/tmp/base-image-key" }}-{{ .Branch }}-
            - ccache-v3-<< parameters.build_type >>-{{ checksum "/tmp/base-image-key" }}-
      - run:
          name: Build, check changed C sources, and smoke-test installation
          no_output_timeout: 30m
          command: bash .circleci/build-image.sh << parameters.build_type >>
      - save_cache:
          key: ccache-v3-<< parameters.build_type >>-{{ checksum "/tmp/base-image-key" }}-{{ .Branch }}-{{ .Revision }}-{{ epoch }}
          paths: [.ci-cache/ccache]
      - store_artifacts:
          path: /tmp/build-reports
      - when:
          condition: << pipeline.parameters.registry_transfer >>
          steps:
            - run:
                name: Push pipeline-specific test image
                command: bash .circleci/image-transfer.sh push << parameters.build_type >>
      - unless:
          condition: << pipeline.parameters.registry_transfer >>
          steps:
            - run:
                name: Save test image
                no_output_timeout: 30m
                command: |
                  mkdir -p /tmp/images
                  docker save afni/afni_<< parameters.build_type >> | pigz -2 > /tmp/images/<< parameters.build_type >>.tar.gz
            - save_cache:
                key: image-v3-<< pipeline.id >>-<< parameters.build_type >>
                paths: [/tmp/images/<< parameters.build_type >>.tar.gz]

  test:
    executor: linux
    parallelism: 2
    parameters:
      build_type:
        type: enum
        enum: [cmake_build, make_build]
    steps:
      - setup_host
      - restore_image:
          build_type: << parameters.build_type >>
      - run:
          name: Identify pinned test-data revision
          command: git ls-tree HEAD tests/afni_ci_test_data | awk '{print $3}' > /tmp/test-data-key
      - restore_cache:
          keys:
            - test-data-v3-<< parameters.build_type >>-{{ checksum "/tmp/test-data-key" }}-{{ .Environment.CIRCLE_NODE_INDEX }}-
      - run:
          name: Split tests by file timings
          command: |
            cd tests
            circleci tests glob 'scripts/**/test_*.py' 'scripts/**/*_test.py' \
              | grep -v '^scripts/test_python_style.py$' \
              | circleci tests split --split-by=timings --timings-type=filename > /tmp/afni-test-files
      - run:
          name: Run full scientific test selection for this shard
          no_output_timeout: 60m
          command: python .circleci/run-tests.py << parameters.build_type >> /tmp/afni-test-files
      - test_reports
      - save_cache:
          key: test-data-v3-<< parameters.build_type >>-{{ checksum "/tmp/test-data-key" }}-{{ .Environment.CIRCLE_NODE_INDEX }}-{{ .Revision }}-{{ epoch }}
          paths: [tests/afni_ci_test_data]

  containers_check:
    executor: linux
    steps:
      - setup_host
      - setup_base
      - restore_image:
          build_type: cmake_build
      - restore_image:
          build_type: make_build
      - run: python -m pytest .docker --junitxml=/tmp/container-results/results.xml
      - store_test_results:
          path: /tmp/container-results

  macos_build:
    macos:
      xcode: "26.1.0"
    working_directory: /tmp/src/afni
    steps:
      - checkout
      - run:
          name: Install macOS dependencies
          no_output_timeout: 20m
          command: |
            # Retain the existing workaround for stale Homebrew/cask metadata.
            brew update-reset
            brew update
            brew install --cask xquartz
            brew install python@3.12 ninja ccache jpeg gsl gts openmotif libpng expat freetype fontconfig netpbm
            { uname -m; xcrun clang --version; brew list --versions; } > /tmp/macos-toolchain-key
      - restore_cache:
          keys:
            - macos-ccache-v3-{{ checksum "/tmp/macos-toolchain-key" }}-{{ .Branch }}-
            - macos-ccache-v3-{{ checksum "/tmp/macos-toolchain-key" }}-
      - run:
          name: Configure and build on macOS
          no_output_timeout: 30m
          command: |
            export CCACHE_DIR="$HOME/.cache/afni-ccache"
            export CCACHE_COMPILERCHECK=content
            ccache --max-size=1G
            "$(brew --prefix python@3.12)/bin/python3.12" -m venv /tmp/afni-venv
            source /tmp/afni-venv/bin/activate
            python -m pip install setuptools==75.8.0 cmake==3.31.10
            cmake -S . -B build -GNinja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/macos_toolchainfile.cmake \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DSTANDARD_PYTHON_INSTALL=OFF \
              -DUSE_SYSTEM_GLW=OFF -DUSE_SYSTEM_XMHTML=OFF -DUSE_SYSTEM_F2C=OFF \
              -DCOMP_RSTATS=OFF -DUSE_SYSTEM_GIFTI=OFF
            cmake --build build --parallel 4
            ccache --show-stats
      - save_cache:
          key: macos-ccache-v3-{{ checksum "/tmp/macos-toolchain-key" }}-{{ .Branch }}-{{ .Revision }}-{{ epoch }}
          paths: [~/.cache/afni-ccache]

  deploy:
    executor: linux
    steps:
      - setup_host
      - setup_base
      - restore_image:
          build_type: cmake_build
      - restore_image:
          build_type: make_build
      - run:
          name: Publish verified release images
          no_output_timeout: 40m
          command: |
            test "$DOCKER_USER" = afni
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            for image in afni_dev_base afni_cmake_build afni_make_build; do
              docker tag "afni/$image" "afni/$image:$CIRCLE_TAG"
              docker push "afni/$image:$CIRCLE_TAG"
              docker push "afni/$image:latest"
            done

  coverage_check:
    executor: linux
    steps:
      - setup_host
      - setup_base
      - run:
          name: Build instrumented image
          no_output_timeout: 30m
          command: |
            docker build --build-arg AFNI_WITH_COVERAGE=1 --target builder \
              -t afni/afni_cmake_build -f .docker/cmake_build.dockerfile .
      - run:
          name: Collect coverage without uploading to external services
          no_output_timeout: 60m
          command: python .circleci/run-tests.py cmake_build --coverage
      - test_reports

workflows:
  afni_tests:
    unless: << pipeline.parameters.coverage >>
    jobs:
      - lint:
          filters: &all_refs
            tags: {only: /.*/}
      - build:
          name: cmake_build
          build_type: cmake_build
          requires: [lint]
          filters: *all_refs
      - build:
          name: make_build
          build_type: make_build
          requires: [lint]
          filters: *all_refs
      - test:
          name: test_cmake_build
          build_type: cmake_build
          requires: [cmake_build]
          filters: *all_refs
      - test:
          name: test_make_build
          build_type: make_build
          requires: [make_build]
          filters: *all_refs
      - macos_build:
          requires: [cmake_build]
          filters: *all_refs
      - containers_check:
          requires: [cmake_build, make_build]
          filters: *all_refs
      - deploy:
          requires: [test_cmake_build, test_make_build, macos_build, containers_check]
          filters:
            tags: {only: /AFNI_\d\d\.\d\.\d\d/}
            branches: {ignore: /.*/}
  # Trigger with pipeline parameter coverage=true. No upload credentials needed.
  coverage:
    when: << pipeline.parameters.coverage >>
    jobs:
      - lint:
          name: coverage_lint
      - coverage_check:
          requires: [coverage_lint]
