name: afni_dev_local    # [pt:2026-08-28] updated to run on local machine OK
channels:               # NB: could likely remove sphinx stuff here, too
  - conda-forge         # NB2: must still be installed in afni/tests/
  - defaults
dependencies:
  - attrs
  - autopep8
  - black=20.8b1
  - cmake
  - datalad
  - docker-py
  - filelock
  - ipython
  - matplotlib
  - nibabel
  - ninja
  - pip
  - pytest
  - pytest-cov
  - pytest-xdist
  - cloud_sptheme                    # start of elements for doc building...
  - pandoc
  - pbr
  - pip
  - "python=3.10"                 # [pt] 3.11 causes issues in Python changes
  - attrs                         # [pt] apparently needed
  - pandas
  - scipy
  - sphinx
  - sphinx-argparse
  - sphinxcontrib-fulltoc
  - sphinx-copybutton
  - tcsh                             # .. end of elements for doc building
  - pip:
    - sphinxcontrib-programoutput    # also for doc building
    - darker
    - git+https://github.com/leej3/xvfbwrapper.git@add_support_for_xquartz_and_multi_threading
    - pdbpp
    - -e .
